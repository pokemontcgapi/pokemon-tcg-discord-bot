# Tool configuration only: the bot is two files, not a package. Dependencies are in requirements.txt.

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "A", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["bot.py", "quotes.py", "test_quotes.py"]

[tool.pytest.ini_options]
testpaths = ["."]
